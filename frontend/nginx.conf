server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # Allow uploads up to 10 MB (app validates at 5 MB max, this is the transport ceiling)
    client_max_body_size 10M;

    # Gzip text assets
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Long cache for hashed CRA assets
    location /static/ {
        root   /usr/share/nginx/html;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy all /api/* to the backend container.
    # Note: backend routes already include the /api prefix,
    # so we forward the path untouched (NO trailing slash on proxy_pass).
    location /api/ {
        proxy_pass         http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Streaming-friendly defaults for file uploads/downloads
        proxy_request_buffering off;
        proxy_buffering         off;

        # Generous timeouts for large uploads / slow networks
        proxy_connect_timeout   60s;
        proxy_send_timeout      300s;
        proxy_read_timeout      300s;
    }

    # SPA fallback (React Router)
    location / {
        root        /usr/share/nginx/html;
        index       index.html;
        try_files   $uri $uri/ /index.html;
    }

    # Security & misc
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
